<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../assets/logo-odsi.png">
  <title>Usuários — Sistema de Empréstimo de Chaves</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>

<div class="app-shell">
  <div id="sidebar-overlay" class="sidebar-overlay"></div>
  <nav class="sidebar" id="sidebar" aria-label="Navegação principal">
    <div class="sidebar__logo">
      <div class="sidebar__logo-mark">
        <img class="sidebar__logo-image" src="../assets/logo-odsi.png" alt="Logo ODSI — Sistema de Gerenciamento de Empréstimos de Chaves, Laboratórios da UFS">
      </div>
    </div>
    <div class="sidebar__nav">
      <div class="nav-section">
        <a href="dashboard.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Dashboard</a>
        <a href="laboratorios.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7.5" cy="15.5" r="5.5"/><path d="M21 2l-9.6 9.6"/><path d="M15.5 7.5L18 10l3-3-2.5-2.5"/></svg>Laboratórios</a>
        <a href="emprestimos.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg>Histórico</a>
      </div>
      <div class="nav-section">
        <div class="nav-section__label">Gestão</div>
        <a href="aprovacao.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Aprovações</a>
      </div>
      <div class="nav-section">
        <div class="nav-section__label">Administração</div>
        <a href="alunos.html" class="nav-link nav-link--active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Usuários</a>
        <a href="admin.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/></svg>Admin</a>
      </div>
    </div>
    <div class="sidebar__footer">
      <div class="user-info">
        <img id="user-avatar" class="user-info__avatar" src="" alt="Avatar">
        <div class="user-info__details"><div id="user-name" class="user-info__name">Carregando...</div><div id="user-role" class="user-info__role"></div></div>
        <div class="user-info__actions">
          <button id="theme-toggle" class="btn btn--icon" aria-label="Alternar tema"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
          <button id="logout-btn" class="btn btn--icon" aria-label="Sair"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
        </div>
      </div>
    </div>
  </nav>

  <div class="main-content">
    <header class="topbar">
      <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Abrir menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="topbar__title">
        <h1>Usuários</h1>
        <p>Gerenciamento de perfis e permissões</p>
      </div>
      <div class="topbar__actions">
        <button id="btn-new-user" class="btn btn--primary btn--sm">+ Cadastrar Usuário</button>
      </div>
    </header>

    <main class="page-content">
      <div class="page-header">
        <div>
          <span id="users-count" class="text-muted text-sm">0</span>
          <span class="text-muted text-sm"> usuários cadastrados</span>
        </div>
        <input id="search-input" type="text" placeholder="Buscar por nome ou e-mail..." style="max-width:280px">
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Usuário</th>
              <th>Perfil</th>
              <th>Status</th>
              <th>Cadastrado em</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="users-tbody">
            <tr><td colspan="5" class="table-loading">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</div>

<!-- Modal: Cadastrar/Editar Usuário -->
<div id="modal-user" class="modal" aria-hidden="true" role="dialog">
  <div class="modal__backdrop"></div>
  <div class="modal__panel">
    <div class="modal__header">
      <h2 id="modal-user-title">Cadastrar Usuário</h2>
      <button id="modal-user-close" class="btn btn--icon" aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <form id="modal-user-form">
      <div class="modal__body content-gap">
        <div class="form-group">
          <label for="user-nome">Nome completo <span class="required">*</span></label>
          <input type="text" id="user-nome" required placeholder="Nome do usuário">
        </div>
        <div class="form-group">
          <label for="user-email">E-mail Google <span class="required">*</span></label>
          <input type="email" id="user-email" required placeholder="email@gmail.com">
          <span class="form-hint">O usuário usará este e-mail para autenticar com o Google.</span>
        </div>
        <div class="form-group">
          <label for="user-role">Perfil <span class="required">*</span></label>
          <select id="user-role" required>
            <option value="user">Usuário</option>
            <option value="approver">Aprovador</option>
            <option value="admin">Administrador</option>
          </select>
        </div>
        <label class="form-checkbox">
          <input type="checkbox" id="user-ativo" checked>
          Conta ativa
        </label>
      </div>
      <div class="modal__footer">
        <button type="button" id="modal-user-cancel" class="btn btn--ghost">Cancelar</button>
        <button type="submit" id="user-submit-btn" class="btn btn--primary">Salvar</button>
      </div>
    </form>
  </div>
</div>

<script type="module" src="../js/alunos.js"></script>
<script>
  const toggle = document.getElementById('sidebar-toggle');
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  toggle?.addEventListener('click', () => { sidebar.classList.toggle('sidebar--open'); overlay.classList.toggle('sidebar-overlay--active'); });
  overlay?.addEventListener('click', () => { sidebar.classList.remove('sidebar--open'); overlay.classList.remove('sidebar-overlay--active'); });
</script>

</body>
</html>
